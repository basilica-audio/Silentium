name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set CPM source cache path
        shell: bash
        run: echo "CPM_SOURCE_CACHE=$HOME/.cache/CPM" >> "$GITHUB_ENV"

      - name: Cache CPM dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CPM_SOURCE_CACHE }}
          key: ${{ runner.os }}-cpm-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-cpm-

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Configure (macOS)
        if: runner.os == 'macOS'
        run: >
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: cmake -B build

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: cmake --build build

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: cmake --build build --config Release

      - name: Test (macOS)
        if: runner.os == 'macOS'
        run: ctest --test-dir build --output-on-failure

      - name: Test (Windows)
        if: runner.os == 'Windows'
        run: ctest --test-dir build --output-on-failure -C Release

      - name: Locate plugin artefacts
        id: artefacts
        shell: bash
        env:
          ARTEFACT_ROOT: build/Silentium_artefacts
          # Must match the configuration the build steps above actually produce:
          # -DCMAKE_BUILD_TYPE=Release on macOS, --config Release on Windows.
          # JUCE emits artefacts into <target>_artefacts/<CONFIG>/ for both
          # single- and multi-config generators.
          BUILD_CONFIG: Release
        run: |
          set -euo pipefail

          CONFIG_ROOT="$ARTEFACT_ROOT/$BUILD_CONFIG"
          if [ ! -d "$CONFIG_ROOT" ]; then
            echo "::error::No $BUILD_CONFIG artefact directory at $CONFIG_ROOT"
            echo "Contents of $ARTEFACT_ROOT:"
            ls -la "$ARTEFACT_ROOT" || true
            exit 1
          fi

          # Resolve exactly one artefact of the requested kind, scoped to the
          # configuration that was built. The previous locator searched the whole
          # artefact root and took `head -n 1`, which on Windows resolved the
          # stale multi-config Debug/ bundle: pluginval then scanned a directory
          # the plugin had never been built into. See basilica-audio/Nave#36.
          find_artefact() {
            local kind="$1"
            local matches count
            matches=$(find "$CONFIG_ROOT" -maxdepth 2 -type d -iname "*.$kind" | sort)
            count=$(printf '%s' "$matches" | grep -c . || true)
            if [ "$count" -ne 1 ]; then
              echo "::error::Expected exactly one .$kind artefact under $CONFIG_ROOT, found $count" >&2
              printf '%s\n' "$matches" >&2
              return 1
            fi
            printf '%s' "$matches"
          }

          VST3_PATH=$(find_artefact vst3)
          echo "vst3_path=$VST3_PATH" >> "$GITHUB_OUTPUT"
          echo "Found VST3 at: $VST3_PATH"

          if [ "$RUNNER_OS" = "macOS" ]; then
            COMPONENT_PATH=$(find_artefact component)
            echo "component_path=$COMPONENT_PATH" >> "$GITHUB_OUTPUT"
            echo "Found AU component at: $COMPONENT_PATH"
          fi

      - name: Download pluginval (macOS)
        if: runner.os == 'macOS'
        shell: bash
        env:
          PLUGINVAL_VERSION: v1.0.4
          PLUGINVAL_MACOS_SHA256: 3c4c533bda0c5059eea3ddaea752d757ee2025041f0f47e6bcb0e87f6082b29f
        run: |
          set -euo pipefail
          curl -sL -o pluginval.zip "https://github.com/Tracktion/pluginval/releases/download/${PLUGINVAL_VERSION}/pluginval_macOS.zip"
          echo "${PLUGINVAL_MACOS_SHA256}  pluginval.zip" | shasum -a 256 -c -
          unzip -q pluginval.zip -d pluginval
          chmod +x "pluginval/pluginval.app/Contents/MacOS/pluginval"

      - name: Download pluginval (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          PLUGINVAL_VERSION: v1.0.4
          PLUGINVAL_WINDOWS_SHA256: c08e61ce3b96db41636f8ec7e76f4c7e2c13ebdac7fa1b5a1f52b4f32ec715ab
        run: |
          $ErrorActionPreference = "Stop"
          Invoke-WebRequest -Uri "https://github.com/Tracktion/pluginval/releases/download/$env:PLUGINVAL_VERSION/pluginval_Windows.zip" -OutFile pluginval.zip
          $actualHash = (Get-FileHash -Path pluginval.zip -Algorithm SHA256).Hash.ToLower()
          if ($actualHash -ne $env:PLUGINVAL_WINDOWS_SHA256) {
            Write-Error "pluginval.zip checksum mismatch: expected $env:PLUGINVAL_WINDOWS_SHA256, got $actualHash"
            exit 1
          }
          Expand-Archive -Path pluginval.zip -DestinationPath pluginval

      - name: Install AU component (macOS)
        id: install_au
        if: runner.os == 'macOS'
        shell: bash
        env:
          COMPONENT_PATH: ${{ steps.artefacts.outputs.component_path }}
        run: |
          set -euo pipefail
          # Installed before validation rather than after, because macOS only
          # resolves an AU that is registered with the system: pluginval scans
          # the component through AudioUnitPluginFormat, not by reading the
          # bundle off disk.
          COMPONENTS_DIR="$HOME/Library/Audio/Plug-Ins/Components"
          COMPONENT_NAME=$(basename "$COMPONENT_PATH")
          INSTALLED_PATH="${COMPONENTS_DIR:?}/${COMPONENT_NAME:?}"

          mkdir -p "$COMPONENTS_DIR"
          rm -rf "$INSTALLED_PATH"
          cp -R "$COMPONENT_PATH" "$COMPONENTS_DIR/"
          killall -9 AudioComponentRegistrar || true

          echo "installed_component_path=$INSTALLED_PATH" >> "$GITHUB_OUTPUT"
          echo "Installed AU component at: $INSTALLED_PATH"

      - name: Run pluginval (macOS)
        if: runner.os == 'macOS'
        shell: bash
        env:
          VST3_PATH: ${{ steps.artefacts.outputs.vst3_path }}
          COMPONENT_PATH: ${{ steps.install_au.outputs.installed_component_path }}
        run: |
          set -euo pipefail
          PLUGINVAL="pluginval/pluginval.app/Contents/MacOS/pluginval"
          mkdir -p pluginval-logs

          validate() {
            local label="$1" target="$2"
            local log="pluginval-logs/${label}.log"
            local rc=0

            echo "::group::pluginval (${label}): ${target}"
            set +e
            "$PLUGINVAL" --strictness-level 10 --validate "$target" 2>&1 | tee "$log"
            rc=${PIPESTATUS[0]}
            set -e
            echo "::endgroup::"

            .github/scripts/assert-pluginval-passed.sh "$log" "$rc" "$label"
          }

          validate macos-vst3 "$VST3_PATH"
          # The AU is a separately built binary. auval alone never put it through
          # pluginval's strictness-10 sweep, so half the shipped macOS surface was
          # unvalidated. See basilica-audio/Nave#36.
          validate macos-au "$COMPONENT_PATH"

      - name: Run pluginval (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VST3_PATH: ${{ steps.artefacts.outputs.vst3_path }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path pluginval-logs | Out-Null
          $log = 'pluginval-logs/windows-vst3.log'
          $errLog = 'pluginval-logs/windows-vst3.err.log'

          # pluginval is built with juce_add_gui_app, so pluginval.exe is a
          # Windows GUI-subsystem binary. PowerShell's call operator does not
          # wait for GUI-subsystem processes and leaves $LASTEXITCODE unset,
          # which is exactly how a run printing "Num plugins found: 0",
          # "FAILURE" and "*** FAILED" still produced a green job
          # (basilica-audio/Nave#36). Start-Process -Wait -PassThru waits on the
          # process handle regardless of subsystem and yields a real ExitCode.
          $proc = Start-Process -FilePath '.\pluginval\pluginval.exe' `
            -ArgumentList @('--strictness-level', '10', '--validate', $env:VST3_PATH) `
            -NoNewWindow -Wait -PassThru `
            -RedirectStandardOutput $log -RedirectStandardError $errLog

          if ((Test-Path $errLog) -and ((Get-Item $errLog).Length -gt 0)) {
            Get-Content $errLog | Add-Content $log
          }

          Write-Host "::group::pluginval (windows-vst3): $env:VST3_PATH"
          if (Test-Path $log) { Get-Content $log }
          Write-Host "::endgroup::"

          # A null ExitCode means we could not establish that it passed, which
          # must be treated as a failure rather than assumed to be zero.
          $code = if ($null -eq $proc.ExitCode) { 1 } else { $proc.ExitCode }

          & bash .github/scripts/assert-pluginval-passed.sh $log $code 'windows-vst3'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: auval validation (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          auval -strict -v aufx Slnt Yvsv

      - name: Upload plugin artefacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: silentium-${{ matrix.os }}
          path: build/Silentium_artefacts/**
          if-no-files-found: error
